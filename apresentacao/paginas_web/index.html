<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aceites Pendentes — FFA</title>
    <meta name="description" content="Dashboard corporativo para monitoramento de aceites pendentes EMIS/ETER">
    <link rel="stylesheet" href="estilo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- ═══ HEADER ═══ -->
    <header class="app-header">
        <div class="header-inner">
            <!-- Brand -->
            <div class="brand">
                <img src="logo.png" alt="Logo FFA" class="logo">
                <div class="brand-sep"></div>
                <span class="brand-title">ACEITES PENDENTES</span>
            </div>

            <!-- Projeto Toggle -->
            <nav class="projeto-toggle" aria-label="Projeto">
                <button id="btn-emis" class="toggle-btn active" aria-pressed="true">EMIS</button>
                <button id="btn-eter" class="toggle-btn" aria-pressed="false">ETER</button>
            </nav>

            <!-- Ações rápidas -->
            <div class="header-actions">
                <div class="sync-info">
                    <i data-lucide="clock" class="sync-icon"></i>
                    <span id="texto-atualizacao">Carregando...</span>
                </div>
                <a href="/upload.html" class="btn-upload">
                    <i data-lucide="upload-cloud"></i>
                    Sincronizar
                </a>
            </div>
        </div>

        <!-- ═══ BARRA DE FILTROS ═══ -->
        <div class="filtros-bar">
            <div id="container-filtro-status" class="filtro-item">
                <label for="filtro-status"><i data-lucide="activity"></i> Status</label>
                <select id="filtro-status">
                    <option value="all">Todos</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Aceito">Aceito</option>
                </select>
            </div>
            <div class="filtro-item">
                <label for="filtro-nome"><i data-lucide="user"></i> Técnico</label>
                <select id="filtro-nome">
                    <option value="all">Todos os técnicos</option>
                </select>
            </div>
            <div class="filtro-item">
                <label for="filtro-base"><i data-lucide="map-pin"></i> Base</label>
                <select id="filtro-base">
                    <option value="all">Todas as bases</option>
                </select>
            </div>
            <div class="filtro-item">
                <label for="filtro-material"><i data-lucide="package"></i> Material</label>
                <select id="filtro-material">
                    <option value="all">Todos os materiais</option>
                </select>
            </div>
        </div>
    </header>

    <!-- ═══ CONTEÚDO PRINCIPAL ═══ -->
    <main class="conteudo">

        <!-- KPIs -->
        <section class="kpis-row" aria-label="Indicadores">
            <div id="card-kpi-aceitos" class="kpi-card kpi-aceito">
                <div class="kpi-info">
                    <span class="kpi-label">TOTAL ACEITO</span>
                    <span class="kpi-num" id="kpi-aceitos" aria-live="polite">–</span>
                </div>
                <div class="kpi-icone">
                    <i data-lucide="check-circle-2"></i>
                </div>
            </div>
            <div class="kpi-card kpi-pendente">
                <div class="kpi-info">
                    <span class="kpi-label">TOTAL PENDENTE</span>
                    <span class="kpi-num" id="kpi-pendentes" aria-live="polite">–</span>
                </div>
                <div class="kpi-icone">
                    <i data-lucide="alert-circle"></i>
                </div>
            </div>
        </section>

        <!-- Tabela -->
        <section class="card tabela-card" aria-label="Tabela de pendências">
            <div class="card-header">
                <div>
                    <h2><i data-lucide="table-2"></i> Detalhamento de Pendências</h2>
                    <p>Lista consolidada por técnico, base e material</p>
                </div>
                <span id="contagem-registros" class="badge" aria-live="polite">–</span>
            </div>
            <div class="tabela-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>TÉCNICO</th>
                            <th>BASE</th>
                            <th>MATERIAL</th>
                            <th>STATUS</th>
                            <th class="center">DIAS</th>
                            <th class="right">QTD</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela"></tbody>
                </table>
            </div>
        </section>

        <!-- Gráficos -->
        <section class="graficos-row" aria-label="Gráficos">
            <div class="card grafico-card">
                <div class="card-header">
                    <div>
                        <h2><i data-lucide="bar-chart-horizontal-big"></i> TOP 5 Pendências</h2>
                        <p>Por técnico responsável</p>
                    </div>
                </div>
                <div class="canvas-box">
                    <canvas id="grafico-tecnicos"></canvas>
                </div>
            </div>
            <div class="card grafico-card">
                <div class="card-header">
                    <div>
                        <h2><i data-lucide="bar-chart-2"></i> Pendências por Base</h2>
                        <p>Distribuição regional</p>
                    </div>
                </div>
                <div class="canvas-box">
                    <canvas id="grafico-bases"></canvas>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="aplicacao.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
